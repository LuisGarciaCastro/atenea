name: Claude Code
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]

jobs:
  claude:
    # Solo el dueño del repo (o su token, que es quien abre los issues desde Telegram) dispara el agente.
    if: |
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association || github.event.issue.author_association) && (
        contains(github.event.comment.body, '@claude') ||
        contains(github.event.issue.body, '@claude') ||
        contains(github.event.issue.title, '@claude')
      ) && !(
        contains(github.event.comment.body, 'youtube.com') ||
        contains(github.event.comment.body, 'youtu.be') ||
        (
          github.event_name == 'issues' && (
            contains(github.event.issue.body, 'youtube.com') ||
            contains(github.event.issue.body, 'youtu.be')
          )
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@f27be6b65a4652f08a2ba3cff79114829b588967 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --allowedTools "Bash,WebFetch(domain:youtube.com),WebFetch(domain:www.youtube.com),WebFetch(domain:registry.npmjs.org),WebFetch(domain:npmjs.org),WebFetch(domain:api.telegram.org)"
          settings: |
            {
              "env": {
                "TELEGRAM_BOT_TOKEN": "${{ secrets.TELEGRAM_BOT_TOKEN }}",
                "TELEGRAM_CHAT_ID": "${{ secrets.TELEGRAM_CHAT_ID }}"
              }
            }

      - name: Avisar del fallo
        if: failure()
        uses: ./.github/actions/avisar-fallo
        with:
          telegram_bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram_chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
