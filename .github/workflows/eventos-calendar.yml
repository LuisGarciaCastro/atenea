name: Eventos — interpretar y crear en Google Calendar
on:
  schedule:
    - cron: "31 * * * *"
  workflow_dispatch: {}

concurrency:
  group: eventos-calendar

jobs:
  interpretar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
      # Sin pendientes no se arranca a Claude (24 pasadas al día); si la app no responde, falla y avisa.
      - name: ¿Hay eventos pendientes?
        id: pendientes
        env:
          SECRETO: ${{ secrets.EVENTOS_CRON_SECRET }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
        # `shell: bash` activa pipefail: si curl falla, el paso falla (y avisa) en vez de seguir con N vacío.
        shell: bash
        run: |
          N=$(curl -sfL -H "Authorization: Bearer $SECRETO" "${APP_BASE_URL%/}/api/eventos/cron/pendientes" | jq '.eventos | length')
          [[ "$N" =~ ^[0-9]+$ ]] || { echo "Respuesta inesperada de la app"; exit 1; }
          echo "Pendientes: $N"
          echo "hay=$([ "$N" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: anthropics/claude-code-action@f27be6b65a4652f08a2ba3cff79114829b588967 # v1
        if: steps.pendientes.outputs.hay == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --allowedTools "Bash(curl:*)"
          settings: |
            {
              "env": {
                "EVENTOS_CRON_SECRET": "${{ secrets.EVENTOS_CRON_SECRET }}",
                "APP_BASE_URL": "${{ secrets.APP_BASE_URL }}",
                "GOOGLE_CLIENT_ID": "${{ secrets.GOOGLE_CLIENT_ID }}",
                "GOOGLE_CLIENT_SECRET": "${{ secrets.GOOGLE_CLIENT_SECRET }}",
                "GOOGLE_REFRESH_TOKEN": "${{ secrets.GOOGLE_REFRESH_TOKEN }}",
                "TELEGRAM_BOT_TOKEN": "${{ secrets.TELEGRAM_BOT_TOKEN }}",
                "TELEGRAM_CHAT_ID": "${{ secrets.TELEGRAM_CHAT_ID }}"
              }
            }
          prompt: |
            Eres el agente de interpretación horaria de Eventos del hub personal del usuario.

            1. Ejecuta:
               curl -s -H "Authorization: Bearer $EVENTOS_CRON_SECRET" \
                 "${APP_BASE_URL%/}/api/eventos/cron/pendientes"
               Devuelve { "eventos": [...] }, cada uno con id, texto_original, fecha,
               estado, google_event_id y correccion_pendiente (puede venir null).
               Si la lista está vacía, termina sin hacer nada más (no mandes Telegram).

            2. Para cada evento pendiente:
               - Si tiene correccion_pendiente, interpreta texto_original CORREGIDO por
                 ese texto libre (la corrección manda sobre lo que contradiga del original).
                 Si no tiene correccion_pendiente, interpreta solo texto_original.
               - Asume zona horaria Europe/Madrid y usa el valor de "fecha" (no la fecha
                 de hoy) como referencia de "hoy" para resolver días relativos
                 ("mañana", "el martes", etc.).
               - Si consigues determinar con confianza un título corto y una fecha/hora
                 concreta (día, mes, año, hora):
                 a. Obtén un access token fresco:
                    curl -s -X POST https://oauth2.googleapis.com/token \
                      -d client_id="$GOOGLE_CLIENT_ID" \
                      -d client_secret="$GOOGLE_CLIENT_SECRET" \
                      -d refresh_token="$GOOGLE_REFRESH_TOKEN" \
                      -d grant_type=refresh_token
                 b. Si el evento YA tiene google_event_id (viene de una corrección sobre
                    un evento ya creado), actualízalo:
                    curl -s -X PATCH \
                      -H "Authorization: Bearer <access_token>" \
                      -H "Content-Type: application/json" \
                      -d '{"summary": "<titulo>", "start": {"dateTime": "<ISO8601 con offset Madrid>", "timeZone": "Europe/Madrid"}, "end": {"dateTime": "<ISO8601 inicio+1h>", "timeZone": "Europe/Madrid"}}' \
                      "https://www.googleapis.com/calendar/v3/calendars/primary/events/<google_event_id>"
                    Si NO tiene google_event_id, créalo:
                    curl -s -X POST \
                      -H "Authorization: Bearer <access_token>" \
                      -H "Content-Type: application/json" \
                      -d '{"summary": "<titulo>", "start": {"dateTime": "<ISO8601 con offset Madrid>", "timeZone": "Europe/Madrid"}, "end": {"dateTime": "<ISO8601 inicio+1h>", "timeZone": "Europe/Madrid"}}' \
                      "https://www.googleapis.com/calendar/v3/calendars/primary/events"
                    Guarda el "id" que devuelve Google como google_event_id.
                 c. Marca el registro como resuelto:
                    curl -s -X PATCH -H "Authorization: Bearer $EVENTOS_CRON_SECRET" \
                      -H "Content-Type: application/json" \
                      -d '{"estado": "creado", "titulo": "<titulo>", "fecha_hora_evento": "<ISO8601>", "google_event_id": "<id>", "correccion_procesada": <correccion_pendiente tal como la leíste, o null>}' \
                      "${APP_BASE_URL%/}/api/eventos/cron/<id>"
               - correccion_procesada sirve para que, si el usuario manda otra corrección mientras
                 trabajas, no se pierda: devuelve exactamente la que has aplicado.
               - Si la fecha/hora es ambigua o incompleta y no puedes tener confianza
                 razonable, NO toques Google Calendar. En su lugar:
                 curl -s -X PATCH -H "Authorization: Bearer $EVENTOS_CRON_SECRET" \
                   -H "Content-Type: application/json" \
                   -d '{"estado": "necesita_revision", "motivo_revision": "<motivo breve>", "correccion_procesada": <correccion_pendiente tal como la leíste, o null>}' \
                   "${APP_BASE_URL%/}/api/eventos/cron/<id>"

            3. Si procesaste al menos un evento en esta pasada, manda un resumen a Telegram:
               curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
                 -H "Content-Type: application/json" \
                 -d '{"chat_id": "'"$TELEGRAM_CHAT_ID"'", "text": "<resumen>"}'
               El resumen debe listar cada evento procesado en esta pasada, una línea por
               evento, con el formato exacto:
               "#<id> · <titulo> · <fecha/hora en formato dd/mm HH:mm>"
               o, si necesita revisión:
               "#<id> · necesita revisión: <motivo>"
               y terminar con la línea: "Para corregir uno, responde con #<id> <corrección>".
               No uses reply_markup ni botones, solo texto plano.

      - name: Avisar del fallo
        if: failure()
        uses: ./.github/actions/avisar-fallo
        with:
          telegram_bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram_chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
